<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
</head>
<body class="bg-gray-100">


    <main>
       <section class="container mx-auto px-4 ">

            <div class="text-center my-6">
                <h2 class="text-3xl font-bold">Magaza</h2>
                <p class="text-gray-500">Premium Məhsullar və anlıq endirimlər</p>
            </div>

            <!-- CARDS -->
            <div id="cards" class="flex flex-wrap items-stretch justify-center gap-6">

            </div>

              <!-- WRAPPER -->
            <div class="flex flex-col lg:flex-row items-start justify-between gap-6 my-6 px-4">

                <!-- BASKET -->
                <div class="w-full lg:max-w-[500px] flex flex-col gap-4 bg-white rounded-2xl p-4 shadow transition duration-300 hover:-translate-y-2 ">

                    <!-- HEADER -->
                    <div class="flex items-center justify-between flex-wrap gap-2">
                        <h2 class="text-lg font-semibold">Səbətimiz</h2>

                        <span class="text-sm text-gray-600">
                            Umumi Məhsul sayı :
                            <span class="bg-gray-100 rounded-2xl px-2 py-1 font-medium">4</span>
                        </span>
                    </div>

                    <!-- ITEMS -->
                    <div id="productCard" class="flex flex-col gap-3">

                    </div>
                </div>

                <!-- SUMMARY -->
                <div class="w-full lg:max-w-[400px] bg-black p-5 text-white rounded-2xl flex flex-col gap-4 transition duration-300 hover:-translate-y-2 ">

                    <h3 class="text-lg font-semibold">Yekun</h3>

                    <!-- Məbləğ -->
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-300">Məhsul məbləği</span>
                        <span>1234 AZN</span>
                    </div>

                    <!-- Endirim -->
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-300">Məhsul endirimi</span>
                        <span class="text-red-500">-1234 AZN</span>
                    </div>

                    <!-- Kupon -->
                    <div class="flex items-center justify-between text-sm border-t border-gray-700 pt-3">
                        <span class="text-gray-300">Kupon kodu (%)</span>

                        <input
                            type="number"
                            value="0"
                            class="bg-gray-800 rounded-xl w-[60px] text-center outline-none"
                        >
                    </div>

                    <!-- Total -->
                    <div class="flex items-center justify-between pt-2 border-t border-gray-700">
                        <span class="text-sm text-gray-300">Ödəniləcək Məbləğ</span>
                        <span class="text-lg font-bold">121312 AZN</span>
                    </div>

                    <!-- BUTTON -->
                    <button class="bg-white text-black rounded-2xl px-3 py-2 font-medium hover:bg-gray-200 transition">
                        Sifarişi Tamamla
                    </button>

                </div>

            </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
